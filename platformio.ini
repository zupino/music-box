[platformio]
src_dir = firmware/teensy

[env]
platform = teensy
framework = arduino
monitor_speed = 115200
lib_deps =
  adafruit/Adafruit GFX Library
  adafruit/Adafruit SSD1306
build_flags =
  -DMUSIC_BOX_TEENSY=1
  -DMUSIC_BOX_AUDIO_ADAPTER=1

[env:teensy40]
board = teensy40
build_flags =
  ${env.build_flags}
  -DMUSIC_BOX_TEENSY40=1
  -DMUSIC_BOX_SD_BUILTIN=0

[env:teensy41]
board = teensy41
build_flags =
  ${env.build_flags}
  -DMUSIC_BOX_TEENSY41=1
  -DMUSIC_BOX_SD_BUILTIN=1
