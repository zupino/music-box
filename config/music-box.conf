# SPDX-License-Identifier: MIT
# Music Box runtime configuration.

# All sixteen MPD218 pads, bank B, listed by the printed PAD 1..16 labels from
# top-left to bottom-right.
# The factory preset's MIDI notes ascend in the opposite row direction, so this
# is deliberately not numerical order. Listing fewer
# notes leaves the remaining pads inert, which is what keeps a configuration
# written for the earlier four-slot looper working.
loop_notes=64,65,66,67,60,61,62,63,56,57,58,59,52,53,54,55
# Retained for configuration compatibility; assigned loop tracks now reference
# sampler storage rather than owning another set of audio buffers.
max_loop_seconds=30

# Performance mode. In loop mode pads start/stop their matching tracks and a
# long press assigns the K4-selected sample to that pad's track; in sampler mode a pad holds a
# recording that plays once per tap; in pad mode the pads play the FluidSynth
# SoundFont. The banks are independent, so loops and samples keep playing in
# every mode.
# Knob 2 (K2, bank A) selects the mode, a third of its travel each in the order
# loop, sampler, pad. The knob is absolute, so the mode follows it only once
# moved, and the service always starts in pad mode.
mode_control_enabled=true
mode_cc=9
# Half-width of the dead band around each of the two switch points, in CC
# counts out of 127. This is the rotation a mode change costs once the knob is
# near a switch, so lower it for a lighter switch and raise it if a resting knob
# flaps between modes on its own jitter. Capped at 16, since a dead band wider
# than half a zone would make sampler mode unreachable.
mode_cc_hysteresis=2
# In every mode, each separate K3 movement toggles speaker-monitor recording
# into the first free sampler slot; direction does not matter.
loop_select_cc=12
sample_select_cc=13
trim_start_cc=14
trim_end_cc=15
# These utility buttons may not emit MIDI on the factory preset. Enable only
# after `aseqdump -p MPD218` confirms the CC numbers.
monitor_modifier_enabled=false
monitor_modifier_cc=127
loop_panic_enabled=false
loop_panic_cc=126
# Longest sampler recording, per pad. Sixteen stereo buffers of this length are
# allocated at startup and shared by assigned loop tracks.
max_sample_seconds=10
# How long a pad must stay down to arm a sampler recording. A shorter press
# triggers the stored sample instead. This also sizes the sampler pre-roll: a
# sample runs from the press, not from the moment the hold is recognised, so
# this much of the input is kept rolling and laid down as the take's head.
pad_hold_milliseconds=400

# Shared sample-accurate transport.
bpm=120.0
beats_per_bar=4
# off, beat, or bar. Loop mode only; sampler recording is never quantized and
# lasts exactly as long as its pad is held.
quantize=bar

# Adafruit 128x32 SSD1306 mode, pad and beat display.
display_enabled=true
display_i2c_device=/dev/i2c-1
display_i2c_address=0x3c
# Rotate the complete OLED image when the enclosure mounts it upside-down.
display_rotate_180=false
# Seconds the volume indication replaces the pad screen; 0 disables it.
display_volume_seconds=2

# Hardware playback volume from the MPD218 top-left knob (K1, bank A).
# Confirm the controller number with: aseqdump -p MPD218
volume_control_enabled=true
volume_cc=3
volume_mixer_card=hw:wm8960soundcard
# Comma-separated; the knob moves every listed output together. Headphone is
# the WM8960 3.5 mm jack, Speaker the on-board amplifier terminals.
volume_mixer_control=Speaker,Headphone
# Spread the knob over the control's decibel range instead of its raw register
# range. The WM8960 mutes below raw 48, so the raw mapping wastes the first
# third of the travel and crams 0 dB into the last few percent. Set to false to
# get the plain proportional mapping back.
volume_db_curve=true

# Lightweight built-in stereo NLMS acoustic echo cancellation.
# The default delay of 512 frames matches a common JACK setup of 256 frames
# and two periods. Tune this first if speaker audio remains in recordings.
aec_enabled=true
aec_taps=128
aec_delay_frames=512
aec_step_size=0.05
aec_double_talk_ratio=4.0
noise_gate_enabled=true
noise_gate_threshold=0.015
noise_gate_floor_gain=0.10
noise_gate_attack_ms=5
noise_gate_release_ms=120

# Mixer gains. Keep headroom because four loops and the synth may play at once.
synth_gain=0.70
loop_gain=0.70
master_gain=0.80

# Prefix matching tolerates client names containing process IDs.
midi_source_prefix=MPD218
synth_midi_prefix=FLUID Synth
synth_jack_prefix=fluidsynth
