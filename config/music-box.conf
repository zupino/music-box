# SPDX-License-Identifier: MIT
# Music Box runtime configuration.

# Four MPD218 pads reserved for loop control.
loop_notes=52,53,54,55
max_loop_seconds=30

# Shared sample-accurate transport.
bpm=120.0
beats_per_bar=4
# off, beat, or bar
quantize=bar

# Lightweight built-in stereo NLMS acoustic echo cancellation.
# The default delay of 512 frames matches a common JACK setup of 256 frames
# and two periods. Tune this first if speaker audio remains in recordings.
aec_enabled=true
aec_taps=128
aec_delay_frames=512
aec_step_size=0.05
aec_double_talk_ratio=4.0

# Mixer gains. master_gain is both the startup level and the maximum reached
# by the optional MIDI master-volume knob.
synth_gain=0.70
loop_gain=0.70
master_gain=0.80

# Optional MPD218 knob -> software master volume.
# Run `aseqdump -p CLIENT:PORT`, turn the desired knob, and copy its CC number.
# Use "off" to disable and "any" to accept the CC on every MIDI channel.
master_volume_cc=off
master_volume_channel=any
master_volume_smoothing_ms=30

# Prefix matching tolerates client names containing process IDs.
midi_source_prefix=MPD218
synth_midi_prefix=FLUID Synth
synth_jack_prefix=fluidsynth
